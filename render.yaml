services:
  - type: web
    name: smartdesk-full
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: NODE_ENV=production npm start
    healthCheckPath: /api/trang-thai
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      # Render dung bien nay trong luc build; giu devDependencies de Vite co mat.
      - key: NODE_ENV
        value: development
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
