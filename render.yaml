services:
  - type: web
    name: smartdesk-full
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: NODE_ENV=production npm start
    healthCheckPath: /api/trang-thai
    envVars:
      - key: NODE_VERSION
        value: 24.13.0
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
